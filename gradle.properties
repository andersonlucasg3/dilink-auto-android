org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Single source of the version: semantic versioning MAJOR.MINOR.PATCH
# (this repository keeps the v0.17.1 / v0.19.0-dev-N numbering it always used).
# versionCode is maintained by hand and must be monotonic: Android refuses a downgrade
# (`pm install -r` rejects a lower code). It continues from the highest code ever
# published — 26111723, produced by the fork-era date scheme (v20261117-2315) — so the
# upcoming semver build still installs on top of that release instead of requiring an
# uninstall. See docs/release.md §1.
app.versionName=0.19.0
app.versionCode=26111724
