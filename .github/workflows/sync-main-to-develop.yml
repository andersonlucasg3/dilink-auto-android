name: Sync Main → Develop

# git-flow back-merge: after a release or hotfix on main, bring main back into develop so the
# two lines do not diverge for long.
#
# Note: this repository's ruleset (Default protected branches, id 15567815) enables the
# `pull_request` rule on both main and develop, so **direct pushes are forbidden**. That is why
# this workflow cannot `git push origin develop` (rejected with GH013, issue #76) and instead
# opens a main→develop back-merge PR automatically; the PR runs the normal `Build` gate and the
# back-merge finishes when it is merged.
#
# Idempotent: exits immediately when develop already contains main, and does not open a second
# PR while a back-merge PR is already open.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-back-merge-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open back-merge PR if develop is behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main develop

          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main, no back-merge needed"
            exit 0
          fi

          existing=$(gh pr list --base develop --head main --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "back-merge PR #$existing is already open, skipping"
            exit 0
          fi

          gh pr create \
            --base develop \
            --head main \
            --title "chore: back-merge main into develop ($(date -u +%Y-%m-%d))" \
            --body "main has new commits ($(git rev-parse --short origin/main)); back-merging them into develop automatically to keep the two git-flow lines in sync. Created by .github/workflows/sync-main-to-develop.yml."
