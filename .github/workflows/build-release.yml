name: Build (Release)

# 正式发版：日期-时间 tag（issue #224）。
#
# `v20261117-2247` → 当天那一轮迭代。tag 规则与 gradle.properties 的
# app.versionName 必须逐字一致，否则包里的版本号与 Release 标题对不上。
#
# GitHub 的 tag 过滤器不是正则：`+` 表示「前一个字符一次或多次」，
# `{8}` 这类量词不生效，必须把每一位写出来（见 docs/release.md §5 坑 9）。
# 历史三段式 tag（v1.0.2 / v1.0.3）保留在过滤里，那些 tag 已经发过，
# 这里只是让它们在新规则下也不会误触发（`!*dev*` 同样保留）。
on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '!*dev*'

permissions:
  contents: write

jobs:
  release:
    # 本仓库已脱离 fork 网络，没有 self-hosted runner：走 self-hosted 会让
    # tag 发布永远 queued（audit B-03 之后的第二次修正）。
    runs-on: ubuntu-latest
    # 发布仍然挂在 protected `release` environment 后面，tag 不能直接静默发版。
    environment: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          if [ ! -f "$ANDROID_HOME/platforms/android-34/build.prop" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            mkdir -p $ANDROID_HOME/cmdline-tools/latest
            unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools/latest
            mv $ANDROID_HOME/cmdline-tools/latest/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ 2>/dev/null || true
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              > /dev/null
          fi

      # 正式 keystore 只存在于 secret（base64 单行），构建前落到 runner 临时目录。
      # 仓库里只有 app-client/build.gradle.kts 的默认相对路径，绝不提交 keystore 本体。
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 RELEASE_KEYSTORE_BASE64 secret，release 变体没有 keystore 会直接失败（audit B-12）" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dilink-auto-release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/dilink-auto-release.jks" >> "$GITHUB_ENV"

      - name: Build Release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app-server:assembleRelease :app-client:assembleRelease
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # issue #37 回归门禁：release 客户端内嵌的车机包必须与 release 车机包同证书，
      # 否则手机端自更新会把 debug 签名包推到车上，被 PM 以签名不一致拒绝。
      # 比对的是两份产物本身的证书摘要，换 keystore 不需要改这里。
      - name: Verify embedded car APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          embedded=$("$APKSIGNER" verify --print-certs app-client/src/main/assets/app-server.apk | grep 'SHA-256 digest')
          car=$("$APKSIGNER" verify --print-certs app-server/build/outputs/apk/release/app-server-release.apk | grep 'SHA-256 digest')
          echo "embedded: $embedded"
          echo "car:      $car"
          if [ "$embedded" != "$car" ]; then
            echo "内嵌车机包与 release 车机包证书不一致（issue #37）" >&2
            exit 1
          fi

      # issue #224：tag 与包内版本号必须逐字一致，否则 Release 标题写的版本
      # 和用户装上的版本对不上，现场取证会被误导。
      # 日期-时间 tag 走这里；历史三段式 tag 不做该校验（那些 tag 已发布）。
      - name: Verify tag matches versionName
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION_NAME="${TAG#v}"
          if printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]{8}-[0-9]{4}$'; then
            FILE_VERSION=$(grep '^app.versionName' gradle.properties | sed 's/.*=//' | tr -d '\r')
            echo "tag=$VERSION_NAME gradle.properties=$FILE_VERSION"
            if [ "$VERSION_NAME" != "$FILE_VERSION" ]; then
              echo "ERROR: tag($VERSION_NAME) 与 gradle.properties 的 app.versionName($FILE_VERSION) 不一致（issue #224）" >&2
              exit 1
            fi
          else
            echo "非日期-时间 tag（$VERSION_NAME），跳过版本串一致性校验"
          fi

      - name: Rename APKs
        run: |
          cp app-client/build/outputs/apk/release/app-client-release.apk DiLinkAuto-Phone.apk
          cp app-server/build/outputs/apk/release/app-server-release.apk DiLinkAuto-Car.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dilink-auto-release-apks
          path: |
            DiLinkAuto-Phone.apk
            DiLinkAuto-Car.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DiLinkAuto-Phone.apk
            DiLinkAuto-Car.apk
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
