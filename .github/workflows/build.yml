name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    # Pure gate workflow: push and pull_request run the same debug build + unit tests.
    # Everything runs on GitHub-hosted runners (ubuntu-latest): this repository has no
    # self-hosted runner, so `self-hosted` would leave branch/tag jobs queued forever
    # (the "pushed, nothing happened" failure before the CI fix). Publishing APKs is the
    # job of the tag-triggered build-release.yml / build-pre-release.yml; this workflow
    # does not run assembleRelease and injects no signing secrets. The audit B-03 cache
    # poisoning protection stays: PRs get a read-only cache, pushes may write.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          if [ ! -f "$ANDROID_HOME/platforms/android-34/build.prop" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            mkdir -p $ANDROID_HOME/cmdline-tools/latest
            unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools/latest
            mv $ANDROID_HOME/cmdline-tools/latest/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ 2>/dev/null || true
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              > /dev/null
          fi

      # The gate matches docs/PR_GUIDE.md "self-check before opening a PR": debug build + unit tests.
      # No signing secret is injected — this job produces no release artifact, which upgrades the
      # audit B-09/F-09 "no secrets in PRs" rule to "no secrets in build.yml".
      # :protocol-core:test must stay in CI: FrameCodecWriteTimeoutTest is the #70 regression
      # case, and it used to run only in manual local test runs, so its false red on Linux went
      # unnoticed.
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app-client:assembleDebug :app-client:testDebugUnitTest :protocol-core:test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dilink-auto-client-debug
          path: app-client/build/outputs/apk/debug/app-client-*.apk
